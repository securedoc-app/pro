<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__APP_NAME__</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3">__APP_NAME__</h1>
        <p class="text-muted">App generada por SecureDoc. Conectada a tu propio Firebase.</p>
        <p class="small text-muted">Colección de datos: <code>__APP_COLLECTION__</code></p>
        <div id="status" class="alert alert-secondary">Conectando a Firebase...</div>
        <ul id="items" class="list-group"></ul>
      </div>
    </div>
  </div>
  <script>
    // Config del Firebase del usuario (pública por naturaleza)
    const firebaseConfig = __FIREBASE_CONFIG__;
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLLECTION = "__APP_COLLECTION__";
    const statusEl = document.getElementById('status');
    const itemsEl = document.getElementById('items');
    db.collection(COLLECTION).limit(50).get()
      .then(snap => {
        statusEl.className = 'alert alert-success';
        statusEl.textContent = 'Conectado. Documentos: ' + snap.size;
        snap.forEach(doc => {
          const li = document.createElement('li');
          li.className = 'list-group-item';
          li.textContent = doc.id + ': ' + JSON.stringify(doc.data());
          itemsEl.appendChild(li);
        });
      })
      .catch(err => {
        statusEl.className = 'alert alert-warning';
        statusEl.textContent = 'Estado: ' + err.code + ' (revisa las reglas de tu Firestore)';
      });
  </script>
</body>
</html>

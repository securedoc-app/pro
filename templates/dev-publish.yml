# SecureDoc - publica de desarrollo (privado) a produccion (publico): minifica y ofusca src/ (v1)
# Lo crea la app SecureDoc. Se ejecuta al subir cambios a main en src/ o .securedoc/, y con el boton "Publicar" de la app.
# El secreto SECUREDOC_DEPLOY_TOKEN (lo guarda SecureDoc cifrado) permite escribir en el repositorio de produccion.
name: SecureDoc - publicar en produccion
on:
  push:
    branches: [main]
    paths: ['src/**', '.securedoc/**']
  workflow_dispatch:
concurrency:
  group: securedoc-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar herramientas
        run: npm install --no-save --no-audit --no-fund --prefix .securedoc esbuild@^0.25 javascript-obfuscator@^4 html-minifier-terser@^7
      - name: Construir (minificar y ofuscar)
        run: node .securedoc/build.mjs
      - name: Publicar en produccion
        env:
          DEPLOY_TOKEN: ${{ secrets.SECUREDOC_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "Falta el secreto SECUREDOC_DEPLOY_TOKEN. En SecureDoc: Desarrollo > menu del proyecto > Actualizar credencial."
            exit 1
          fi
          PROD=$(node -p "require('./.securedoc/config.json').prod")
          case "${PROD}" in */*) ;; *) echo "config.json: falta el campo prod (owner/repositorio)"; exit 1 ;; esac
          OUT=$(node -p "require('./.securedoc/config.json').out || 'dist'")
          git clone --quiet "https://x-access-token:${DEPLOY_TOKEN}@github.com/${PROD}.git" "${RUNNER_TEMP}/prod"
          find "${RUNNER_TEMP}/prod" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${OUT}/." "${RUNNER_TEMP}/prod/"
          cd "${RUNNER_TEMP}/prod"
          git config user.name "securedoc-bot"
          git config user.email "securedoc-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit --quiet -m "Publica ${GITHUB_SHA::7} desde ${GITHUB_REPOSITORY}"
          git push --quiet
          echo "Publicado en https://github.com/${PROD}"
